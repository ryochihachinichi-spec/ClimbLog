<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Climb Log</title>

    <link rel="manifest" href="./manifest.json">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>🧗 Climb Log</h1>


    <!-- ========================================
         ホーム画面
    ========================================= -->

    <div id="home">

        <p>クライミング記録アプリ</p>

        <button id="startButton">
            記録を開始
        </button>

        <button id="historyButton">
            📚 履歴を見る
        </button>


        <div class="backupArea">

            <button id="backupButton">
                📦 バックアップ
            </button>

            <button id="restoreButton">
                📥 取り込み
            </button>

            <input type="file"
                   id="restoreFileInput"
                   accept=".json,application/json">

        </div>

    </div>


    <!-- ========================================
         記録画面
    ========================================= -->

    <div id="record" style="display:none;">

        <button id="backHomeFromRecordButton">
            ← ホームに戻る
        </button>

        <h2>今日の記録</h2>

        <label for="gymSelect">
    ジム
</label>

<select id="gymSelect">

    <option value="">選択してください</option>

    <option value="クライミングジム GooFee">クライミングジム GooFee</option>
    <option value="クライミングジム WHITE ROCK">クライミングジム WHITE ROCK</option>
    <option value="クライミングジム RANBO">クライミングジム RANBO</option>
    <option value="クライミングジム ZE-RO 伊勢崎店">クライミングジム ZE-RO 伊勢崎店</option>
    <option value="クライミングジム ウォールストリート">クライミングジム ウォールストリート</option>
    <option value="Coloré（コロレ）Bouldering Gym">Coloré（コロレ）Bouldering Gym</option>
    <option value="Blue Bird Bouldering Gym">Blue Bird Bouldering Gym</option>
    <option value="And Energy Bouldering">And Energy Bouldering</option>
    <option value="Bouldering Spot Landmark">Bouldering Spot Landmark</option>
    <option value="NOBOROCK 大宮店">NOBOROCK 大宮店</option>
    <option value="エナジークライミングジム浦和店">エナジークライミングジム浦和店</option>
    <option value="Monolithe ボルダリングジム川越">Monolithe ボルダリングジム川越</option>
    <option value="PUMP1 KAWAGUCHI">PUMP1 KAWAGUCHI</option>
    <option value="Lutra Lutra">Lutra Lutra</option>
    <option value="深谷クライミングヴィレッジ">深谷クライミングヴィレッジ</option>
    <option value="Next Gen Bouldering">Next Gen Bouldering</option>
    <option value="Walrus">Walrus</option>
    <option value="ZE-RO さいたま店">ZE-RO さいたま店</option>
    <option value="OKKU ROCK">OKKU ROCK</option>
    <option value="お家">お家</option>

    <option value="その他">その他</option>

</select>

<div id="gymOtherContainer" style="display:none;">

    <input type="text"
           id="gymOther"
           placeholder="ジム名を入力">

</div>

<div class="inputSection">

    <label for="wallType">
        壁の種類
    </label>

    <select id="wallType">

        <option value="">選択してください</option>
        <option value="スラブ">スラブ</option>
        <option value="垂壁">垂壁</option>
        <option value="傾斜">傾斜</option>
        <option value="強傾斜">強傾斜</option>
        <option value="その他">その他</option>

    </select>

</div>

        <br><br>

        <label for="photoInput" class="cameraButton">
            📷 壁を撮影
        </label>

        <input type="file"
               id="photoInput"
               accept="image/*"
               capture="environment">


       <!-- マーカー種類 -->

<div class="toolSection">

    <div class="toolTitle">
        マーカー
    </div>

    <div id="markerTools">

        <button type="button"
                class="markerTool active"
                data-type="start">
            S
        </button>

        <button type="button"
                class="markerTool"
                data-type="zone">
            Z
        </button>

        <button type="button"
                class="markerTool"
                data-type="goal">
            T
        </button>

        <button type="button"
                class="markerTool"
                data-type="hold">
            ○
        </button>

        <button type="button"
                class="markerTool"
                data-type="core">
            ◎
        </button>

        <button type="button"
                class="markerTool"
                data-type="erase">
            消
　　　　 </button>    

    </div>

</div>

        <!-- マーカーサイズ -->

        <div class="toolSection">

            <div class="toolTitle">
                マーカーサイズ
            </div>

            <div id="sizeTools">

                <button type="button"
                        class="sizeTool"
                        data-size="small">
                    小
                </button>

                <button type="button"
                        class="sizeTool active"
                        data-size="medium">
                    中
                </button>

                <button type="button"
                        class="sizeTool"
                        data-size="large">
                    大
                </button>

                <button type="button"
                        class="sizeTool"
                        data-size="extra-large">
                    特大
                </button>

            </div>

        </div>


        <!-- 写真 -->

        <div id="wallContainer">

            <img id="wallImage">

            <div id="markers"></div>

        </div>


        <!-- 登りの情報 -->

        <div id="recordInfo">

            <div class="inputSection">

                <label for="grade">
                    グレード
                </label>

                <select id="grade">

                    <option value="">選択してください</option>

                    <option value="8級">8級</option>
                    <option value="7級">7級</option>
                    <option value="6級">6級</option>
                    <option value="5級">5級</option>
                    <option value="4級">4級</option>
                    <option value="3級">3級</option>
                    <option value="2級">2級</option>
                    <option value="1級">1級</option>
                    <option value="初段">初段</option>
                    <option value="二段">二段</option>
                    <option value="三段">三段</option>

                </select>

            </div>


<div class="inputSection">

    <div class="inputLabel">
        トライ結果
    </div>

    <table class="attemptTable">

        <thead>
            <tr>
                <th>トライ</th>
                <th>Z</th>
                <th>T</th>
            </tr>
        </thead>

        <tbody>

            <tr>
                <td>1</td>
                <td>
                    <button type="button"
                            class="attemptButton"
                            data-attempt="1"
                            data-result="Z">
                        ○
                    </button>
                </td>
                <td>
                    <button type="button"
                            class="attemptButton"
                            data-attempt="1"
                            data-result="T">
                        ○
                    </button>
                </td>
            </tr>

            <tr>
                <td>2</td>
                <td>
                    <button type="button"
                            class="attemptButton"
                            data-attempt="2"
                            data-result="Z">
                        ○
                    </button>
                </td>
                <td>
                    <button type="button"
                            class="attemptButton"
                            data-attempt="2"
                            data-result="T">
                        ○
                    </button>
                </td>
            </tr>

            <tr>
                <td>3</td>
                <td>
                    <button type="button"
                            class="attemptButton"
                            data-attempt="3"
                            data-result="Z">
                        ○
                    </button>
                </td>
                <td>
                    <button type="button"
                            class="attemptButton"
                            data-attempt="3"
                            data-result="T">
                        ○
                    </button>
                </td>
            </tr>

            <tr>
                <td>4</td>
                <td>
                    <button type="button"
                            class="attemptButton"
                            data-attempt="4"
                            data-result="Z">
                        ○
                    </button>
                </td>
                <td>
                    <button type="button"
                            class="attemptButton"
                            data-attempt="4"
                            data-result="T">
                        ○
                    </button>
                </td>
            </tr>

            <tr>
                <td>5</td>
                <td>
                    <button type="button"
                            class="attemptButton"
                            data-attempt="5"
                            data-result="Z">
                        ○
                    </button>
                </td>
                <td>
                    <button type="button"
                            class="attemptButton"
                            data-attempt="5"
                            data-result="T">
                        ○
                    </button>
                </td>
            </tr>

            <tr>
                <td>6</td>
                <td>
                    <button type="button"
                            class="attemptButton"
                            data-attempt="6"
                            data-result="Z">
                        ○
                    </button>
                </td>
                <td>
                    <button type="button"
                            class="attemptButton"
                            data-attempt="6"
                            data-result="T">
                        ○
                    </button>
                </td>
            </tr>

            <tr>
                <td>7以上</td>
                <td>
                    <button type="button"
                            class="attemptButton"
                            data-attempt="7+"
                            data-result="Z">
                        ○
                    </button>
                </td>
                <td>
                    <button type="button"
                            class="attemptButton"
                            data-attempt="7+"
                            data-result="T">
                        ○
                    </button>
                </td>
            </tr>

        </tbody>

    </table>

    <div id="autoCompleted"
         class="autoCompleted"
         style="display:none;">
        完登
    </div>

    <div id="completionAttempt"
         class="completionAttempt"
         style="display:none;">
    </div>

</div>

            <div class="inputSection">

                <label for="memo">
                    メモ
                </label>

                <textarea id="memo"
                          rows="4"
                          placeholder="登ったときのメモ"></textarea>

            </div>


            <button id="saveButton"
                    class="saveButton">
                💾 この記録を保存
            </button>

        </div>

    </div>


    <!-- ========================================
         履歴画面
    ========================================= -->

    <div id="history"
         style="display:none;">

        <h2>📚 クライミング履歴</h2>

        <button id="backHomeButton">
            ← ホームに戻る
        </button>

        <div id="historyList">

        </div>

    </div>


    <!-- ========================================
         詳細画面
    ========================================= -->

    <div id="detail"
         style="display:none;">

        <button id="backHistoryButton">
            ← 履歴に戻る
        </button>


        <button id="editRecordButton">
            ✏️ この記録を編集
        </button>


        <h2>📖 記録詳細</h2>


        <div class="detailDate"
             id="detailDate">
        </div>


        <div class="detailGym"
             id="detailGym">
        </div>


        <!-- 保存した写真 -->

        <div id="detailPhotoContainer">

            <img id="detailPhoto">

            <div id="detailMarkers"></div>

        </div>


        <!-- 記録情報 -->

        <div id="detailInfo">

            <div class="detailRow">

                <span class="detailLabel">
                    グレード
                </span>

                <span id="detailGrade">
                </span>

            </div>


            <div class="detailRow">

                <span class="detailLabel">
                    トライ回数
                </span>

                <span id="detailAttempts">
                </span>

            </div>


            <div class="detailRow">

                <span class="detailLabel">
                    完登
                </span>

                <span id="detailCompleted">
                </span>

            </div>

        </div>

        <!-- 壁の種類 -->

<div class="detailRow">

    <span class="detailLabel">
        壁の種類
    </span>

    <span id="detailWallType">
    </span>

</div>


<!-- トライ結果 -->

<div class="detailMemoBox">

    <div class="detailLabel">
        トライ結果
    </div>

    <table class="attemptTable">

        <thead>
            <tr>
                <th>トライ</th>
                <th>Z</th>
                <th>T</th>
            </tr>
        </thead>

        <tbody id="detailAttemptBody">
        </tbody>

    </table>

    <div id="detailCompletionAttempt">
    </div>

</div>
        
        
        <!-- メモ -->

        <div class="detailMemoBox">

            <div class="detailLabel">
                メモ
            </div>

            <div id="detailMemo">
            </div>

        </div>

    </div>


    <script src="app.js"></script>

</body>
</html>
